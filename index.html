<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPL Auto-Manager - Live</title>
<style>
  :root {
    --bg: #05070a;
    --bg2: #0a0e14;
    --panel: rgba(22, 27, 34, 0.6);
    --panel-solid: #12161d;
    --border: rgba(255, 255, 255, 0.08);
    --border-hi: rgba(255, 255, 255, 0.16);
    --text: #eef2f6;
    --muted: #8b94a3;
    --muted2: #5b6472;
    --purple: #37003c;
    --purple2: #7c1a8c;
    --green: #00ff87;
    --green-dim: #04b366;
    --pitch: #0d3b21;
    --pitch2: #0f4d2a;
    --shadow: 0 8px 32px rgba(0,0,0,0.45);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(124,26,140,0.25), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(0,255,135,0.06), transparent 55%),
      var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: relative;
    overflow: hidden;
    background: linear-gradient(120deg, var(--purple) 0%, var(--purple2) 55%, #2b0a4a 100%);
    padding: 3.25rem 1.5rem 2.75rem;
    text-align: center;
    border-bottom: 1px solid var(--border-hi);
  }
  header::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 42px);
    pointer-events: none;
  }
  header::after {
    content: "";
    position: absolute;
    width: 480px;
    height: 480px;
    right: -180px;
    top: -220px;
    background: radial-gradient(circle, rgba(0,255,135,0.18), transparent 70%);
    filter: blur(10px);
    pointer-events: none;
  }
  .eyebrow {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--green);
    background: rgba(0, 255, 135, 0.08);
    border: 1px solid rgba(0, 255, 135, 0.25);
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    margin-bottom: 1rem;
  }
  .eyebrow .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px 2px rgba(0,255,135,0.7);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }
  header h1 {
    position: relative;
    margin: 0 0 0.5rem;
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  header p {
    position: relative;
    margin: 0;
    color: #d9c2e0;
    font-size: 1rem;
    max-width: 40ch;
    margin: 0 auto;
  }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 1.75rem 1.25rem 2rem;
  }
  .meta-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.85rem;
    margin: -2.5rem 0 1.75rem;
    position: relative;
    z-index: 2;
  }
  .meta-card {
    background: var(--panel);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem 1.1rem;
    box-shadow: var(--shadow);
    transition: transform 0.18s ease, border-color 0.18s ease;
  }
  .meta-card:hover {
    transform: translateY(-2px);
    border-color: var(--border-hi);
  }
  .meta-card .label {
    color: var(--muted);
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .meta-card .value {
    font-size: 1.35rem;
    font-weight: 750;
    margin-top: 0.25rem;
    letter-spacing: -0.01em;
  }
  .meta-card.mode .value {
    font-size: 0.95rem;
    font-weight: 650;
    color: var(--green);
  }
  .meta-card.pts .value { color: var(--green); }

  section {
    background: var(--panel);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
  }
  section h2 {
    margin: 0 0 1.1rem;
    font-size: 1.05rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    letter-spacing: -0.01em;
  }
  section h2 .icon { font-size: 1.05rem; }

  .pitch {
    position: relative;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,255,255,0.05), transparent 55%),
      repeating-linear-gradient(to bottom, var(--pitch2) 0, var(--pitch2) 54px, var(--pitch) 54px, var(--pitch) 108px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 1.75rem 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.35);
  }
  .pitch::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    pointer-events: none;
  }
  .pitch-row {
    display: flex;
    justify-content: center;
    gap: 0.65rem;
    flex-wrap: wrap;
    position: relative;
  }
  .player-chip {
    background: rgba(8, 10, 14, 0.82);
    border: 1px solid rgba(255,255,255,0.14);
    border-top: 2px solid var(--chip-accent, rgba(255,255,255,0.3));
    border-radius: 10px;
    padding: 0.55rem 0.65rem 0.5rem;
    text-align: center;
    min-width: 88px;
    font-size: 0.78rem;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .player-chip:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  }
  .player-chip .name {
    font-weight: 700;
    white-space: nowrap;
    letter-spacing: -0.01em;
  }
  .player-chip .sub {
    color: var(--muted);
    font-size: 0.68rem;
    margin-top: 0.1rem;
  }
  .player-chip .pts {
    color: var(--green);
    font-weight: 700;
    margin-top: 0.3rem;
    font-size: 0.82rem;
  }
  .badge {
    display: inline-block;
    font-size: 0.6rem;
    font-weight: 800;
    background: var(--green);
    color: #04321a;
    border-radius: 4px;
    padding: 0.05rem 0.32rem;
    margin-left: 0.3rem;
    vertical-align: middle;
    box-shadow: 0 0 8px rgba(0,255,135,0.4);
  }
  .badge.vc {
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
    box-shadow: none;
  }

  .bench-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 1.5rem;
    margin-bottom: 0.75rem;
  }
  .bench-header h2 { margin: 0; }
  .bench-list {
    display: flex;
    gap: 0.65rem;
    flex-wrap: wrap;
  }
  .bench-list .player-chip {
    background: rgba(255,255,255,0.03);
    border-color: var(--border);
    border-top-color: rgba(255,255,255,0.18);
    opacity: 0.85;
  }

  .activity-item {
    position: relative;
    padding: 0.15rem 0 1rem 1.35rem;
    border-left: 2px solid var(--border);
    margin-left: 0.3rem;
  }
  .activity-item:last-child { padding-bottom: 0; }
  .activity-item::before {
    content: "";
    position: absolute;
    left: -6px;
    top: 0.3rem;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 3px rgba(0,255,135,0.15);
  }
  .activity-item .header {
    font-weight: 650;
    font-size: 0.92rem;
    color: var(--text);
  }
  .activity-item ul {
    margin: 0.4rem 0 0;
    padding-left: 1.1rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .activity-item li { margin-bottom: 0.15rem; }
  .no-activity {
    color: var(--muted2);
    font-size: 0.9rem;
    padding: 0.5rem 0;
  }

  .footnote {
    text-align: center;
    color: var(--muted2);
    font-size: 0.82rem;
    margin-top: 0.25rem;
  }
  .footnote strong { color: var(--muted); font-weight: 600; }

  footer {
    text-align: center;
    color: var(--muted2);
    font-size: 0.8rem;
    padding: 2rem 1.5rem 2.5rem;
    border-top: 1px solid var(--border);
    margin-top: 1rem;
  }
  footer a { color: var(--green); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  .loading, .error {
    text-align: center;
    color: var(--muted);
    padding: 4rem 1rem;
    font-size: 0.95rem;
  }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 1rem;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--green);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #app { animation: fadein 0.4s ease; }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .meta-row { margin-top: -2rem; }
    section { padding: 1.15rem; }
    .player-chip { min-width: 76px; font-size: 0.72rem; padding: 0.45rem 0.5rem; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow"><span class="dot"></span> Live &middot; Fully Automated</div>
  <h1>&#9917; FPL Auto-Manager</h1>
  <p>A data-driven Fantasy Premier League manager that scores, selects, and (when live) transfers on its own &mdash; no manual picks.</p>
</header>

<main id="app">
  <div class="loading"><div class="spinner"></div>Loading latest status&hellip;</div>
</main>

<footer>
  Built and run autonomously &middot; strategy stays private, this dashboard is just the output &middot;
  <a href="https://smunkl.uk">smunkl.uk</a>
</footer>

<script>
const TEAM_COLORS = {
  ARS:"#EF0107", AVL:"#95BFE5", BOU:"#DA291C", BRE:"#e30613", BHA:"#0057B8",
  CHE:"#034694", CRY:"#1B458F", EVE:"#003399", FUL:"#000000", IPS:"#0044A9",
  LEI:"#003090", LIV:"#C8102E", MCI:"#6CABDD", MUN:"#DA291C", NEW:"#241F20",
  NFO:"#DD0000", SOU:"#D71920", TOT:"#132257", WHU:"#7A263A", WOL:"#FDB913",
  LEE:"#FFCD00", BUR:"#6C1D45", SUN:"#EB172B"
};

async function load() {
  const app = document.getElementById('app');
  try {
    const res = await fetch('status.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('status.json not found yet');
    const data = await res.json();
    render(data);
  } catch (err) {
    app.innerHTML = '<div class="error">No status published yet. Check back soon.</div>';
    console.error(err);
  }
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

function playerChip(p) {
  const badges = [];
  if (p.captain) badges.push('<span class="badge">C</span>');
  if (p.vice_captain) badges.push('<span class="badge vc">VC</span>');
  const accent = TEAM_COLORS[p.team] || 'rgba(255,255,255,0.3)';
  return `<div class="player-chip" style="--chip-accent:${accent}">
    <div class="name">${p.name}${badges.join('')}</div>
    <div class="sub">${p.position} &middot; ${p.team}</div>
    ${p.projected_points !== undefined ? `<div class="pts">${p.projected_points.toFixed(1)} pts</div>` : ''}
  </div>`;
}

function groupByPosition(players) {
  const order = ['GKP', 'DEF', 'MID', 'FWD'];
  const groups = {};
  for (const pos of order) groups[pos] = [];
  for (const p of players) (groups[p.position] || (groups[p.position] = [])).push(p);
  return order.map(pos => groups[pos]).filter(g => g.length);
}

function render(data) {
  const app = document.getElementById('app');
  const rows = groupByPosition(data.starting_xi || []).map(
    row => `<div class="pitch-row">${row.map(playerChip).join('')}</div>`
  ).join('');
  const bench = (data.bench || []).map(playerChip).join('');
  const activity = (data.recent_activity || []).slice().reverse().map(a => `
    <div class="activity-item">
      <div class="header">${a.header}</div>
      ${a.details && a.details.length ? `<ul>${a.details.map(d => `<li>${d.replace(/^- /, '')}</li>`).join('')}</ul>` : ''}
    </div>
  `).join('') || '<p class="no-activity">No changes yet this gameweek.</p>';

  app.innerHTML = `
    <div class="meta-row">
      <div class="meta-card"><div class="label">Gameweek</div><div class="value">GW${data.gameweek ?? '-'}</div></div>
      <div class="meta-card mode"><div class="label">Mode</div><div class="value">${data.mode ?? '-'}</div></div>
      <div class="meta-card"><div class="label">Bank</div><div class="value">&pound;${(data.bank ?? 0).toFixed(1)}m</div></div>
      <div class="meta-card"><div class="label">Free transfers</div><div class="value">${data.free_transfers ?? '-'}</div></div>
      <div class="meta-card pts"><div class="label">Projected pts</div><div class="value">${(data.total_projected_points ?? 0).toFixed(1)}</div></div>
    </div>

    <section>
      <h2><span class="icon">&#9917;</span> Current Starting XI</h2>
      <div class="pitch">${rows}</div>
      <div class="bench-header"><h2 style="margin:0;font-size:0.95rem;color:var(--muted)">Bench</h2></div>
      <div class="bench-list">${bench}</div>
    </section>

    <section>
      <h2><span class="icon">&#128203;</span> Recent Activity</h2>
      ${activity}
    </section>

    <p class="footnote">Last updated <strong>${fmtDate(data.last_updated)}</strong> &middot; Next deadline <strong>${fmtDate(data.deadline)}</strong></p>
  `;
}

load();
</script>

</body>
</html>
