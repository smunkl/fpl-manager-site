<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPL Auto-Manager - Live</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<header>
  <div class="eyebrow"><span class="dot"></span> Live &middot; Fully Automated</div>
  <h1>&#9917; FPL Auto-Manager</h1>
  <p>A data-driven Fantasy Premier League manager that scores, selects, and (when live) transfers on its own &mdash; no manual picks.</p>
  <nav class="sitenav">
    <a href="index.html" class="active">Live Squad</a>
    <a href="history.html">History</a>
    <a href="rivals.html">Rivals</a>
    <a href="strategy.html">How It Works</a>
  </nav>
</header>

<main id="app">
  <div class="loading"><div class="spinner"></div>Loading latest status&hellip;</div>
</main>

<footer>
  Built and run autonomously &middot; <a href="strategy.html">read how it decides</a> &middot;
  <a href="https://smunkl.uk">smunkl.uk</a>
</footer>

<script>
const TEAM_COLORS = {
  ARS:"#EF0107", AVL:"#95BFE5", BOU:"#DA291C", BRE:"#e30613", BHA:"#0057B8",
  CHE:"#034694", CRY:"#1B458F", EVE:"#003399", FUL:"#000000", IPS:"#0044A9",
  LEI:"#003090", LIV:"#C8102E", MCI:"#6CABDD", MUN:"#DA291C", NEW:"#241F20",
  NFO:"#DD0000", SOU:"#D71920", TOT:"#132257", WHU:"#7A263A", WOL:"#FDB913",
  LEE:"#FFCD00", BUR:"#6C1D45", SUN:"#EB172B"
};

async function load() {
  const app = document.getElementById('app');
  try {
    const res = await fetch('status.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('status.json not found yet');
    const data = await res.json();
    let proposed = null;
    try {
      const pres = await fetch('proposed.json', { cache: 'no-store' });
      if (pres.ok) proposed = await pres.json();
    } catch (e) { /* proposed.json is optional - older runs won't have it yet */ }
    render(data, proposed);
  } catch (err) {
    app.innerHTML = '<div class="error">No status published yet. Check back soon.</div>';
    console.error(err);
  }
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

function playerChip(p) {
  const badges = [];
  if (p.captain) badges.push('<span class="badge">C</span>');
  if (p.vice_captain) badges.push('<span class="badge vc">VC</span>');
  const accent = TEAM_COLORS[p.team] || 'rgba(255,255,255,0.3)';
  return `<div class="player-chip" style="--chip-accent:${accent}">
    <div class="name">${p.name}${badges.join('')}</div>
    <div class="sub">${p.position} &middot; ${p.team}</div>
    ${p.projected_points !== undefined ? `<div class="pts">${p.projected_points.toFixed(1)} pts</div>` : ''}
  </div>`;
}

function groupByPosition(players) {
  const order = ['GKP', 'DEF', 'MID', 'FWD'];
  const groups = {};
  for (const pos of order) groups[pos] = [];
  for (const p of players) (groups[p.position] || (groups[p.position] = [])).push(p);
  return order.map(pos => groups[pos]).filter(g => g.length);
}

function playerRationale(label, p) {
  return `<div class="rationale-player">
    <div class="rationale-player-label">${label}</div>
    <div class="rationale-player-name">${p.name} <span class="sub">(${p.team})</span></div>
    <div class="rationale-stats">
      horizon <strong>${p.horizon.toFixed(1)}</strong> &middot;
      form ${p.form.toFixed(1)} &middot;
      fixture ease ${p.fixture_ease.toFixed(1)} &middot;
      set-piece ${p.set_piece_bonus.toFixed(2)}
    </div>
  </div>`;
}

function renderProposed(proposed) {
  if (!proposed) return '';
  if (!proposed.has_changes) {
    return `<section>
      <h2><span class="icon">&#128302;</span> Proposed for Next Deadline</h2>
      <p class="no-activity">No changes currently proposed &mdash; current squad already looks optimal.</p>
      <p class="footnote" style="margin-top:0.75rem">Next deadline <strong>${fmtDate(proposed.deadline)}</strong></p>
    </section>`;
  }

  const transferBlocks = (proposed.transfers || []).map(t => `
    <div class="proposed-transfer">
      <div class="proposed-transfer-arrow">${t.out.name} <span class="arrow">&rarr;</span> ${t.in.name}</div>
      <div class="rationale-grid">
        ${playerRationale('OUT', t.out)}
        ${playerRationale('IN', t.in)}
      </div>
      ${t.alternatives && t.alternatives.length ? `<div class="alternatives">Other options considered: ${
        t.alternatives.map(a => `${a.name} (${a.horizon.toFixed(1)})`).join(', ')
      }</div>` : ''}
    </div>
  `).join('');

  const hitNote = proposed.hits_taken ? `<div class="callout" style="margin-top:0.75rem">Takes a &minus;${4 * proposed.hits_taken} point hit</div>` : '';

  const capNote = (proposed.captain_change || proposed.vice_change) ? `
    <div class="proposed-captaincy">
      ${proposed.captain_change ? `<div>Captain: ${proposed.captain_change.from} &rarr; <strong>${proposed.captain_change.to}</strong></div>` : ''}
      ${proposed.vice_change ? `<div>Vice: ${proposed.vice_change.from} &rarr; <strong>${proposed.vice_change.to}</strong></div>` : ''}
    </div>` : '';

  return `<section>
    <h2><span class="icon">&#128302;</span> Proposed for Next Deadline</h2>
    ${transferBlocks}
    ${capNote}
    ${hitNote}
    <p class="footnote" style="margin-top:0.75rem">Nothing submitted yet &middot; next deadline <strong>${fmtDate(proposed.deadline)}</strong></p>
  </section>`;
}

function render(data, proposed) {
  const app = document.getElementById('app');
  const rows = groupByPosition(data.starting_xi || []).map(
    row => `<div class="pitch-row">${row.map(playerChip).join('')}</div>`
  ).join('');
  const bench = (data.bench || []).map(playerChip).join('');
  const activity = (data.recent_activity || []).slice().reverse().map(a => `
    <div class="activity-item">
      <div class="header">${a.header}</div>
      ${a.details && a.details.length ? `<ul>${a.details.map(d =>
        d.startsWith('- ') ? `<li>${d.replace(/^- /, '')}</li>`
        : `<li class="rationale">${d.trim()}</li>`
      ).join('')}</ul>` : ''}
    </div>
  `).join('') || '<p class="no-activity">No changes yet this gameweek.</p>';

  app.innerHTML = `
    <div class="meta-row">
      <div class="meta-card"><div class="label">Gameweek</div><div class="value">GW${data.gameweek ?? '-'}</div></div>
      <div class="meta-card mode"><div class="label">Mode</div><div class="value">${data.mode ?? '-'}</div></div>
      <div class="meta-card"><div class="label">Bank</div><div class="value">&pound;${(data.bank ?? 0).toFixed(1)}m</div></div>
      <div class="meta-card"><div class="label">Free transfers</div><div class="value">${data.free_transfers ?? '-'}</div></div>
      <div class="meta-card pts"><div class="label">Projected pts</div><div class="value">${(data.total_projected_points ?? 0).toFixed(1)}</div></div>
    </div>

    <section>
      <h2><span class="icon">&#9917;</span> Current Starting XI</h2>
      <div class="pitch">${rows}</div>
      <div class="bench-header"><h2 style="margin:0;font-size:0.95rem;color:var(--muted)">Bench</h2></div>
      <div class="bench-list">${bench}</div>
    </section>

    ${renderProposed(proposed)}

    <section>
      <h2><span class="icon">&#128203;</span> Recent Activity</h2>
      ${activity}
      <p class="footnote" style="margin-top:1rem;text-align:left"><a href="history.html">View full season history &rarr;</a></p>
    </section>

    <p class="footnote">Last updated <strong>${fmtDate(data.last_updated)}</strong> &middot; Next deadline <strong>${fmtDate(data.deadline)}</strong></p>
  `;
}

load();
</script>

</body>
</html>
